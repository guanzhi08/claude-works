<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>彈珠賽車 v2</title>
<style>
  :root{
    --bg:#0f172a; --sur:#1e293b; --sur2:#334155;
    --acc:#f59e0b; --acc2:#06b6d4; --ok:#10b981; --err:#ef4444;
    --txt:#e2e8f0; --mut:#94a3b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;height:100%;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;background:#0b1220}

  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(15,23,42,.95);z-index:10;padding:24px}
  .ov.show{display:flex}
  .card{background:var(--sur);border-radius:16px;padding:28px 24px;
    max-width:400px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0 0 6px;font-size:1.8rem;color:var(--acc)}
  .sub{color:var(--mut);margin:0 0 20px;font-size:.9rem}
  .btn{display:block;width:100%;padding:14px 20px;margin:8px 0;
    border:none;border-radius:10px;background:var(--acc);color:#1a1a1a;
    font-size:1rem;font-weight:600;cursor:pointer}
  .btn.sec{background:var(--sur2);color:var(--txt)}
  .btn:active{transform:scale(.98)}

  .lvl-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .lvl-btn{padding:22px 8px;border-radius:10px;background:var(--sur2);
    border:2px solid #475569;color:var(--txt);
    font-size:1.3rem;font-weight:700;cursor:pointer}
  .lvl-btn:active{background:var(--acc);color:#1a1a1a}

  .hud{position:fixed;top:0;left:0;right:0;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex;gap:8px;justify-content:space-between;
    background:linear-gradient(180deg,rgba(15,23,42,.9),transparent);
    z-index:5;pointer-events:none;font-weight:600}
  .hud-item{background:rgba(30,41,59,.85);padding:6px 12px;border-radius:8px;font-size:.85rem}
  .hud-item .lbl{color:var(--mut);font-size:.68rem;margin-right:5px}

  .btm{position:fixed;bottom:0;left:0;right:0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;justify-content:center;z-index:5}
  .btm .btn{width:auto;padding:10px 18px;margin:0;font-size:.9rem}

  .hint{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(72px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,.75);padding:8px 16px;border-radius:20px;
    font-size:.85rem;color:var(--acc2);z-index:4;pointer-events:none;
    display:none;white-space:nowrap}
  .hint.show{display:block}

  .ver{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;
    font-size:.65rem;color:var(--mut);z-index:6;pointer-events:none}
</style>
</head>
<body>

<div id="game"><canvas id="cv"></canvas></div>

<div class="hud" id="hud" style="display:none">
  <div class="hud-item"><span class="lbl">金幣</span><span id="hud-coin">0</span></div>
  <div class="hud-item"><span class="lbl">時間</span><span id="hud-time">0.0</span>s</div>
  <div class="hud-item"><span class="lbl">關卡</span><span id="hud-lvl">1</span></div>
</div>

<div class="btm" id="btm" style="display:none">
  <button class="btn sec" onclick="pauseGame()">⏸ 暫停</button>
  <button class="btn sec" onclick="restartLevel()">↺ 重試</button>
</div>

<div class="hint" id="hint">往反方向拖曳瞄準・放開發射・飛行中可滑動導引</div>

<div class="ov show" id="menu">
  <div class="card">
    <h1>🎱 彈珠賽車</h1>
    <p class="sub">拖曳發射・避開障礙・收集金幣・衝過終點</p>
    <div class="lvl-row">
      <button class="lvl-btn" onclick="startLevel(0)">1</button>
      <button class="lvl-btn" onclick="startLevel(1)">2</button>
      <button class="lvl-btn" onclick="startLevel(2)">3</button>
    </div>
    <button class="btn sec" onclick="showOv('howto')">遊戲說明</button>
  </div>
</div>

<div class="ov" id="howto">
  <div class="card" style="text-align:left">
    <h1 style="text-align:center">遊戲說明</h1>
    <p>🎯 <b>發射</b>：像彈弓一樣，往反方向拖曳，放開手指彈珠就會朝瞄準方向飛出</p>
    <p>💪 <b>力道</b>：拖曳距離越長，力道越大（彈珠周圍的環會顯示力道）</p>
    <p>🕹 <b>導引</b>：彈珠飛行中，手指按住畫面任一點，彈珠會朝該點加速轉向</p>
    <p>🟡 <b>金幣</b>：碰到即收集（+10 分）</p>
    <p>🟥 <b>石磚</b>：會反彈，善用反彈可以走近路</p>
    <p>🏁 <b>終點</b>：抵達終點即過關</p>
    <p>⏱ <b>計分</b>：金幣越多、時間越短分數越高</p>
    <button class="btn" onclick="hideOv('howto')">開始遊玩</button>
  </div>
</div>

<div class="ov" id="pause">
  <div class="card">
    <h1>暫停中</h1>
    <button class="btn" onclick="resumeGame()">▶ 繼續</button>
    <button class="btn sec" onclick="restartLevel()">↺ 重試</button>
    <button class="btn sec" onclick="backToMenu()">回主選單</button>
  </div>
</div>

<div class="ov" id="win">
  <div class="card">
    <h1>🏁 過關！</h1>
    <p class="sub" id="win-stats"></p>
    <button class="btn" id="win-next">下一關</button>
    <button class="btn sec" onclick="restartLevel()">↺ 再玩一次</button>
    <button class="btn sec" onclick="backToMenu()">回主選單</button>
  </div>
</div>

<div class="ver">v2</div>

<script>
// ═══════════════════════════════════════
// LEVELS (world coordinates in px)
// ═══════════════════════════════════════
var LEVELS = [
  { // 1: 直線 + 兩片牆
    size:{w:800,h:600},
    start:{x:100,y:300},
    finish:{x:720,y:240,w:60,h:120},
    walls:[
      {x:0,y:0,w:800,h:20},{x:0,y:580,w:800,h:20},
      {x:0,y:0,w:20,h:600},{x:780,y:0,w:20,h:600},
    ],
    blocks:[
      {x:300,y:0,w:40,h:380},
      {x:500,y:220,w:40,h:380},
    ],
    coins:[
      {x:250,y:450},{x:400,y:480},{x:600,y:150},{x:680,y:400},
    ],
  },
  { // 2: 蛇形
    size:{w:900,h:700},
    start:{x:80,y:600},
    finish:{x:800,y:60,w:80,h:80},
    walls:[
      {x:0,y:0,w:900,h:20},{x:0,y:680,w:900,h:20},
      {x:0,y:0,w:20,h:700},{x:880,y:0,w:20,h:700},
    ],
    blocks:[
      {x:200,y:100,w:40,h:450},
      {x:400,y:230,w:40,h:450},
      {x:600,y:100,w:40,h:450},
    ],
    coins:[
      {x:120,y:350},{x:300,y:600},{x:300,y:150},
      {x:500,y:120},{x:500,y:620},
      {x:700,y:600},{x:750,y:250},{x:820,y:400},
    ],
  },
  { // 3: 曲折挑戰
    size:{w:1000,h:800},
    start:{x:80,y:720},
    finish:{x:900,y:60,w:80,h:80},
    walls:[
      {x:0,y:0,w:1000,h:20},{x:0,y:780,w:1000,h:20},
      {x:0,y:0,w:20,h:800},{x:980,y:0,w:20,h:800},
    ],
    blocks:[
      {x:180,y:200,w:40,h:520},
      {x:340,y:80,w:40,h:520},
      {x:500,y:250,w:40,h:520},
      {x:680,y:80,w:40,h:520},
      {x:840,y:280,w:40,h:420},
    ],
    coins:[
      {x:120,y:400},{x:270,y:680},{x:270,y:150},
      {x:430,y:720},{x:430,y:180},
      {x:600,y:680},{x:600,y:180},
      {x:770,y:720},{x:770,y:180},
      {x:940,y:520},
    ],
  },
];

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W=0, H=0, DPR=1;
function resize(){
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

var G = null;
var running = false, paused = false;

function newGame(idx){
  var L = LEVELS[idx];
  G = {
    idx: idx, L: L,
    ball: { x:L.start.x, y:L.start.y, vx:0, vy:0, r:12 },
    coins: L.coins.map(function(c){ return {x:c.x, y:c.y, r:11, taken:false}; }),
    startTime: 0, elapsed: 0,
    score: 0, coinCount: 0,
    state: 'aim',    // 'aim' | 'rolling' | 'won'
    aim: null,       // {sx,sy,cx,cy}
    steer: null,     // {x,y} world-space finger position while rolling
    cam: {x:0, y:0},
    trail: [],
  };
  updateCam(true);
}

// ═══════════════════════════════════════
// OVERLAY
// ═══════════════════════════════════════
function showOv(id){ $(id).classList.add('show'); }
function hideOv(id){ $(id).classList.remove('show'); }

function startLevel(idx){
  hideOv('menu'); hideOv('win'); hideOv('pause'); hideOv('howto');
  newGame(idx);
  $('hud').style.display = 'flex';
  $('btm').style.display = 'flex';
  $('hint').classList.add('show');
  setTimeout(function(){ $('hint').classList.remove('show'); }, 3500);
  running = true; paused = false;
  G.startTime = performance.now();
  requestAnimationFrame(loop);
}

function restartLevel(){
  if(!G) return;
  hideOv('pause'); hideOv('win');
  startLevel(G.idx);
}

function backToMenu(){
  running = false;
  hideOv('pause'); hideOv('win');
  $('hud').style.display = 'none';
  $('btm').style.display = 'none';
  $('hint').classList.remove('show');
  showOv('menu');
}

function pauseGame(){
  if(!running || paused) return;
  paused = true;
  showOv('pause');
}
function resumeGame(){
  if(!paused) return;
  paused = false;
  hideOv('pause');
  G.startTime = performance.now() - G.elapsed;
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════
// INPUT (slingshot aim & launch)
// ═══════════════════════════════════════
function screenToWorld(sx, sy){
  return { x: sx + G.cam.x, y: sy + G.cam.y };
}

function ptDown(sx, sy){
  if(!G) return;
  var p = screenToWorld(sx, sy);
  if(G.state === 'aim'){
    G.aim = { sx:p.x, sy:p.y, cx:p.x, cy:p.y };
  } else if(G.state === 'rolling'){
    G.steer = { x:p.x, y:p.y };
  }
}
function ptMove(sx, sy){
  if(!G) return;
  var p = screenToWorld(sx, sy);
  if(G.aim){ G.aim.cx = p.x; G.aim.cy = p.y; }
  if(G.steer){ G.steer.x = p.x; G.steer.y = p.y; }
}
function ptUp(){
  if(!G) return;
  G.steer = null;
  if(!G.aim) return;
  var a = G.aim; G.aim = null;
  var dx = a.sx - a.cx, dy = a.sy - a.cy;   // reverse: drag back → launch forward
  var dist = Math.hypot(dx, dy);
  if(dist < 8) return; // tap = no-op
  var power = Math.min(dist, 220) / 220;    // 0..1
  var speed = 4 + power * 13;
  var nx = dx / dist, ny = dy / dist;
  G.ball.vx = nx * speed;
  G.ball.vy = ny * speed;
  G.state = 'rolling';
  G.trail = [];
}

cv.addEventListener('pointerdown', function(e){
  cv.setPointerCapture(e.pointerId);
  ptDown(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', function(e){ ptMove(e.clientX, e.clientY); });
cv.addEventListener('pointerup',   function(e){ ptUp(); });
cv.addEventListener('pointercancel', function(e){ ptUp(); });

// ═══════════════════════════════════════
// PHYSICS
// ═══════════════════════════════════════
var FRICTION = 0.992;
var STOP_V   = 0.18;
var BOUNCE   = 0.72;
var STEER_A  = 0.35;   // steering acceleration (px/frame^2)
var MAX_V    = 18;     // max speed under thrust

function step(){
  if(G.state !== 'rolling') return;
  var b = G.ball;

  // steering thrust — apply BEFORE integration
  if(G.steer){
    var sdx = G.steer.x - b.x, sdy = G.steer.y - b.y;
    var sd = Math.hypot(sdx, sdy);
    if(sd > 3){
      b.vx += (sdx / sd) * STEER_A;
      b.vy += (sdy / sd) * STEER_A;
      // cap speed so hold-forever doesn't fly infinitely fast
      var sp = Math.hypot(b.vx, b.vy);
      if(sp > MAX_V){ b.vx = b.vx / sp * MAX_V; b.vy = b.vy / sp * MAX_V; }
    }
  }

  // sub-step to reduce tunneling at high speed
  var v = Math.hypot(b.vx, b.vy);
  var steps = Math.max(1, Math.ceil(v / (b.r * 0.8)));
  for(var i = 0; i < steps; i++){
    b.x += b.vx / steps;
    b.y += b.vy / steps;
    var rects = G.L.walls.concat(G.L.blocks);
    for(var j = 0; j < rects.length; j++) collideCircleRect(b, rects[j]);
  }

  b.vx *= FRICTION;
  b.vy *= FRICTION;

  // trail
  G.trail.push({x:b.x, y:b.y});
  if(G.trail.length > 24) G.trail.shift();

  // coins
  for(var k = 0; k < G.coins.length; k++){
    var c = G.coins[k];
    if(c.taken) continue;
    var dx = b.x - c.x, dy = b.y - c.y;
    var rr = b.r + c.r;
    if(dx*dx + dy*dy < rr*rr){
      c.taken = true;
      G.coinCount++;
      G.score += 10;
    }
  }

  // finish
  var f = G.L.finish;
  if(b.x > f.x && b.x < f.x + f.w && b.y > f.y && b.y < f.y + f.h){
    winLevel();
    return;
  }

  // stop — don't fall through while player is still steering
  var vNow = Math.hypot(b.vx, b.vy);
  if(vNow < STOP_V && !G.steer){
    b.vx = 0; b.vy = 0;
    G.state = 'aim';
    G.trail = [];
  }
}

function collideCircleRect(b, r){
  var nx = Math.max(r.x, Math.min(b.x, r.x + r.w));
  var ny = Math.max(r.y, Math.min(b.y, r.y + r.h));
  var dx = b.x - nx, dy = b.y - ny;
  var dsq = dx*dx + dy*dy;
  if(dsq >= b.r * b.r) return;
  var d = Math.sqrt(dsq) || 0.0001;
  var overlap = b.r - d;
  var ux, uy;
  if(dsq < 0.0001){
    // center inside rect — push out along shortest axis
    var leftD = b.x - r.x, rightD = (r.x + r.w) - b.x;
    var topD  = b.y - r.y, botD   = (r.y + r.h) - b.y;
    var m = Math.min(leftD, rightD, topD, botD);
    if(m === leftD){ ux = -1; uy = 0; }
    else if(m === rightD){ ux = 1; uy = 0; }
    else if(m === topD){ ux = 0; uy = -1; }
    else { ux = 0; uy = 1; }
    overlap = m + b.r;
  } else {
    ux = dx / d; uy = dy / d;
  }
  b.x += ux * overlap;
  b.y += uy * overlap;
  var dot = b.vx * ux + b.vy * uy;
  if(dot < 0){
    b.vx = (b.vx - 2*dot*ux) * BOUNCE;
    b.vy = (b.vy - 2*dot*uy) * BOUNCE;
  }
}

function winLevel(){
  G.state = 'won';
  running = false;
  var timeBonus = Math.max(0, 60 - G.elapsed/1000) * 5;
  G.score += Math.round(timeBonus);
  var maxCoins = G.L.coins.length;
  $('win-stats').innerHTML =
    '金幣 <b>'+G.coinCount+'/'+maxCoins+'</b> · '+
    '用時 <b>'+(G.elapsed/1000).toFixed(1)+'s</b> · '+
    '總分 <b>'+G.score+'</b>';
  var nb = $('win-next');
  if(G.idx < LEVELS.length - 1){
    nb.style.display = 'block';
    nb.onclick = function(){ startLevel(G.idx + 1); };
  } else {
    nb.style.display = 'none';
  }
  showOv('win');
}

// ═══════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════
function updateCam(snap){
  var tx = G.ball.x - W/2;
  var ty = G.ball.y - H/2;
  if(G.L.size.w <= W) tx = (G.L.size.w - W) / 2;
  else tx = Math.max(0, Math.min(tx, G.L.size.w - W));
  if(G.L.size.h <= H) ty = (G.L.size.h - H) / 2;
  else ty = Math.max(0, Math.min(ty, G.L.size.h - H));
  if(snap){ G.cam.x = tx; G.cam.y = ty; }
  else {
    G.cam.x += (tx - G.cam.x) * 0.12;
    G.cam.y += (ty - G.cam.y) * 0.12;
  }
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render(){
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-G.cam.x, -G.cam.y);

  // grid
  ctx.strokeStyle = 'rgba(148,163,184,.08)';
  ctx.lineWidth = 1;
  var gs = 40;
  var gx0 = Math.floor(G.cam.x / gs) * gs;
  var gy0 = Math.floor(G.cam.y / gs) * gs;
  for(var x = gx0; x < G.cam.x + W + gs; x += gs){
    ctx.beginPath(); ctx.moveTo(x, G.cam.y); ctx.lineTo(x, G.cam.y + H); ctx.stroke();
  }
  for(var y = gy0; y < G.cam.y + H + gs; y += gs){
    ctx.beginPath(); ctx.moveTo(G.cam.x, y); ctx.lineTo(G.cam.x + W, y); ctx.stroke();
  }

  // world bounds
  ctx.strokeStyle = 'rgba(6,182,212,.25)';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, G.L.size.w, G.L.size.h);

  // walls
  ctx.fillStyle = '#334155';
  for(var i = 0; i < G.L.walls.length; i++){
    var w = G.L.walls[i];
    ctx.fillRect(w.x, w.y, w.w, w.h);
  }

  // blocks
  for(var i = 0; i < G.L.blocks.length; i++){
    var bk = G.L.blocks[i];
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(bk.x, bk.y, bk.w, bk.h);
    ctx.strokeStyle = '#7f1d1d';
    ctx.lineWidth = 2;
    ctx.strokeRect(bk.x+1, bk.y+1, bk.w-2, bk.h-2);
  }

  // finish (checker + glow)
  drawFinish(G.L.finish);

  // coins
  var t = performance.now() / 300;
  for(var k = 0; k < G.coins.length; k++){
    var c = G.coins[k];
    if(c.taken) continue;
    var sc = 0.85 + Math.sin(t + k) * 0.15;
    ctx.beginPath();
    ctx.fillStyle = '#fbbf24';
    ctx.arc(c.x, c.y, c.r * sc, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fef3c7';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', c.x, c.y);
  }

  // trail
  if(G.trail.length > 1){
    ctx.strokeStyle = 'rgba(6,182,212,.35)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(G.trail[0].x, G.trail[0].y);
    for(var i = 1; i < G.trail.length; i++) ctx.lineTo(G.trail[i].x, G.trail[i].y);
    ctx.stroke();
  }

  // steer UI (during rolling)
  if(G.state === 'rolling' && G.steer){
    var bb0 = G.ball;
    var sdx = G.steer.x - bb0.x, sdy = G.steer.y - bb0.y;
    var sdd = Math.hypot(sdx, sdy);
    if(sdd > 3){
      // dashed line ball → finger
      ctx.strokeStyle = 'rgba(16,185,129,.55)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(bb0.x, bb0.y); ctx.lineTo(G.steer.x, G.steer.y); ctx.stroke();
      ctx.setLineDash([]);
      // target ring at finger
      var pulse = 0.75 + Math.sin(performance.now()/120) * 0.15;
      ctx.strokeStyle = 'rgba(16,185,129,.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(G.steer.x, G.steer.y, 16 * pulse, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(16,185,129,.25)';
      ctx.beginPath(); ctx.arc(G.steer.x, G.steer.y, 8, 0, Math.PI*2); ctx.fill();
    }
  }

  // aim UI
  if(G.state === 'aim' && G.aim){
    var b = G.ball;
    var dx = G.aim.sx - G.aim.cx, dy = G.aim.sy - G.aim.cy;
    var dist = Math.min(Math.hypot(dx, dy), 220);
    if(dist > 4){
      var ang = Math.atan2(dy, dx);
      var len = dist * 1.4;
      var tx = b.x + Math.cos(ang) * len;
      var ty = b.y + Math.sin(ang) * len;
      ctx.strokeStyle = 'rgba(6,182,212,.75)';
      ctx.lineWidth = 3;
      ctx.setLineDash([9, 6]);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.setLineDash([]);
      // arrow
      ctx.fillStyle = 'rgba(6,182,212,.9)';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - Math.cos(ang-0.42)*15, ty - Math.sin(ang-0.42)*15);
      ctx.lineTo(tx - Math.cos(ang+0.42)*15, ty - Math.sin(ang+0.42)*15);
      ctx.closePath(); ctx.fill();
      // power ring
      var power = dist / 220;
      ctx.strokeStyle = 'hsl(' + Math.round((1-power)*120) + ', 85%, 55%)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 7, -Math.PI/2, -Math.PI/2 + Math.PI*2*power);
      ctx.stroke();
    }
  }

  // ball
  var bb = G.ball;
  var grd = ctx.createRadialGradient(bb.x-3, bb.y-4, 2, bb.x, bb.y, bb.r);
  grd.addColorStop(0, '#f0f9ff');
  grd.addColorStop(1, '#0284c7');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#0c4a6e'; ctx.lineWidth = 2; ctx.stroke();

  ctx.restore();
}

function drawFinish(f){
  var sq = 15;
  for(var y = 0; y < f.h; y += sq){
    for(var x = 0; x < f.w; x += sq){
      ctx.fillStyle = (((x/sq | 0) + (y/sq | 0)) % 2 === 0) ? '#ffffff' : '#111827';
      ctx.fillRect(f.x + x, f.y + y, Math.min(sq, f.w - x), Math.min(sq, f.h - y));
    }
  }
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.strokeRect(f.x, f.y, f.w, f.h);
  // flag emoji
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#10b981';
  ctx.fillText('🏁', f.x + f.w/2, f.y - 14);
}

// ═══════════════════════════════════════
// LOOP
// ═══════════════════════════════════════
function updateHUD(){
  $('hud-coin').textContent = G.coinCount + '/' + G.L.coins.length;
  $('hud-time').textContent = (G.elapsed / 1000).toFixed(1);
  $('hud-lvl').textContent  = G.idx + 1;
}

function loop(){
  if(!running || paused) return;
  G.elapsed = performance.now() - G.startTime;
  step();
  updateCam(false);
  render();
  updateHUD();
  requestAnimationFrame(loop);
}
</script>
</body>
